    <!-- 首页封面图预加载：与 EditorialHome 的 <img> 同一组 URL，避免二次请求（见 project-workbench/visual-fix-1-report.md） -->
    <link rel="preload" as="image" href="/brunnchen-cover-1920.webp" imagesrcset="/brunnchen-cover-800.webp 800w, /brunnchen-cover-1200.webp 1200w, /brunnchen-cover-1920.webp 1920w" imagesizes="100vw" fetchpriority="high" />
    <!-- 启动期 CLS 占位 + 首页启动封面：仅首页。boot 封面在 HTML 首屏即绘制（LCP 不再等 JS），
         几何规则复刻 .ed-header / .ed-cover.story-cover（editorial.css / home-story.css），
         二者改尺寸时必须同步。EditorialHome 挂载后移除 boot-home 完成无缝交接。 -->
    <style>
      html.boot-home main {
        min-height: 100vh;
      }
      .boot-home-root {
        display: none;
      }
      html.boot-home .boot-home-root {
        display: block;
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        z-index: 8;
        pointer-events: none;
        background: #fafbf8;
        color: #202823;
        font-family: Inter, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      }
      .boot-header {
        height: 98px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 32px;
        padding: 0 4.5%;
        border-top: 4px solid #bf3327;
        box-sizing: border-box;
      }
      .boot-wordmark {
        display: flex;
        flex-direction: column;
        font-size: 23px;
        font-weight: 850;
        font-style: italic;
        letter-spacing: -0.075em;
        line-height: 1.1;
        color: inherit;
        text-decoration: none;
      }
      .boot-wordmark span {
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.15em;
        font-style: normal;
        margin-top: 8px;
      }
      .boot-header nav {
        display: flex;
        gap: 35px;
        margin-left: auto;
      }
      .boot-header nav a {
        font-size: 14px;
        padding: 14px 0;
        color: inherit;
        text-decoration: none;
      }
      .boot-header-note {
        margin-left: 24px;
        font-size: 9px;
        line-height: 1.65;
        letter-spacing: 0.13em;
        color: #5d665e;
      }
      .boot-cover {
        position: relative;
        margin: 0 24px;
        /* +2px: keep the boot image strictly larger than the real cover so the
           later same-image repaint never replaces it as the LCP candidate. */
        height: calc(max(650px, calc(100svh - 122px)) + 2px);
        max-height: 1052px;
        overflow: hidden;
        background: #14251d;
      }
      .boot-cover img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 82%;
      }
      .boot-cover-shade {
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, rgba(6, 21, 14, 0.62) 0%, rgba(6, 21, 14, 0.12) 56%, transparent 80%), linear-gradient(0deg, rgba(5, 14, 8, 0.3), transparent 35%);
      }
      @media (max-width: 1050px) {
        .boot-header {
          height: 88px;
          padding-inline: 28px;
        }
        .boot-header nav {
          gap: 24px;
        }
        .boot-cover {
          margin-inline: 16px;
        }
      }
      @media (max-width: 760px) {
        .boot-header {
          height: auto;
          min-height: 104px;
          padding: 18px 20px 10px;
          flex-wrap: wrap;
          gap: 10px 14px;
        }
        .boot-wordmark {
          font-size: 20px;
        }
        .boot-wordmark span {
          font-size: 10px;
          margin-top: 5px;
        }
        .boot-header nav {
          order: 3;
          width: 100%;
          margin-left: 0;
          gap: 25px;
        }
        .boot-header nav a {
          font-size: 13px;
          padding: 12px 0;
        }
        .boot-header-note {
          margin-left: 24px;
        }
        .boot-cover {
          margin: 8px 12px 0;
        }
        .boot-cover-shade {
          background: linear-gradient(90deg, #0d231699, #0d23161a), linear-gradient(0deg, #071b0bb3, transparent 40%);
        }
      }
      @media (max-width: 600px) {
        .boot-cover {
          margin: 0 12px;
        }
        .boot-cover img {
          object-position: 79% bottom;
        }
      }
      @media (max-width: 360px) {
        .boot-header {
          padding-inline: 15px;
        }
      }
    </style>
    <script>
      if (location.pathname === '/') {
        document.documentElement.classList.add('boot-home');
      }
    </script>
  </head>
  <body>
    <div class="boot-home-root" inert aria-hidden="true">
      <header class="boot-header">

        </nav>

      <div class="boot-cover">
        <img src="/brunnchen-cover-1920.webp" srcset="/brunnchen-cover-800.webp 800w, /brunnchen-cover-1200.webp 1200w, /brunnchen-cover-1920.webp 1920w" sizes="100vw" alt="" width="1920" height="1280" fetchpriority="high" />
        <div class="boot-cover-shade"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
